<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风洞零线帐</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Wind Tunnel Zero Ledger</p>
      <h1>风洞零线帐</h1>
    </div>
    <div class="actions">
      <button id="exportBtn" type="button">导出运行记录</button>
      <label class="file-button">导入运行记录
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </label>
      <button id="resetBtn" type="button" class="secondary">恢复 fixture</button>
    </div>
  </header>

  <main>
    <section class="panel controls">
      <label>Run
        <select id="runSelect"></select>
      </label>
      <fieldset>
        <legend>空载漂移</legend>
        <label><input type="radio" name="driftMode" value="LINEAR"> 线性</label>
        <label><input type="radio" name="driftMode" value="PIECEWISE"> 分段</label>
      </fieldset>
      <label>旋转次序
        <select id="rotationSelect">
          <option value="ALPHA_THEN_BETA_ZY">α→β，Rz(β)Ry(α)</option>
          <option value="BETA_THEN_ALPHA_YZ">β→α，Ry(α)Rz(β)</option>
        </select>
      </label>
      <label>标定矩阵
        <select id="calibrationSelect"></select>
      </label>
    </section>

    <section id="notice" class="notice hidden"></section>

    <section class="grid charts">
      <article class="panel">
        <h2>状态序列</h2>
        <svg id="timelineSvg" viewBox="0 0 900 150" role="img"></svg>
        <div id="legend" class="legend"></div>
      </article>
      <article class="panel">
        <h2>六通道原值与空载曲线</h2>
        <svg id="channelsSvg" viewBox="0 0 900 260" role="img"></svg>
      </article>
      <article class="panel">
        <h2>角度、动压与温度</h2>
        <svg id="anglesSvg" viewBox="0 0 900 280" role="img"></svg>
      </article>
    </section>

    <section class="panel">
      <h2>测点与最终系数</h2>
      <div class="table-wrap">
        <table id="sampleTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint">点击任一系数按钮，可查看中间向量、矩阵链和逐项贡献；点击时间点可锁定样本。</p>
    </section>

    <section class="grid two">
      <article class="panel">
        <h2>修正解释</h2>
        <div id="explanations"></div>
      </article>
      <article class="panel" id="detailPanel">
        <h2>系数贡献</h2>
        <p class="hint">尚未选择系数。</p>
      </article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
